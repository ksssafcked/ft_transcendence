services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    container_name: frontend
    expose:
      - "3000"

  backend:
    build: ./backend
    container_name: backend
    expose:
      - "4000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/public/avatars:/app/public/avatars
    env_file:
      - .env
